# Release automation for nyc-311-mcp.
#
# Publishes @betanyc/nyc-311-mcp to npm and creates a GitHub Release
# whenever a version tag (v*) is pushed. Part of the fleet-wide
# release-hygiene rollout across BetaNYC's six public MCP repos.
#
# Flow: push a tag like v1.0.1 → this workflow checks the tag matches
# package.json's version, runs tests (if present), publishes to npm with
# provenance, and creates a GitHub Release with auto-generated notes.
#
# Prerequisite: an NPM_TOKEN repository secret (npm automation token with
# publish rights on @betanyc/nyc-311-mcp). id-token: write enables npm
# provenance attestation; contents: write lets the workflow create the
# GitHub Release.
#
# Before tagging: one commit dates the WHATS-CHANGED.md "## Unreleased:" entry and the
# CHANGELOG.md heading with the same New York date, adds the dated anchor to the entry's MCP
# version link, and rebuilds docs/whats-changed.html. Tag that commit. Full steps: README,
# "Releases". The "WHATS-CHANGED.md has no Unreleased entry" step below enforces the dating.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      # server.json is the MCP Registry listing (see publish-mcp.yml). It must
      # be at the same version as package.json and carry its mcpName, or the
      # registry publish that follows this workflow will fail.
      - name: Verify server.json versions match package.json
        run: |
          node -e '
            const p = require("./package.json"), s = require("./server.json");
            const bad = [s.version, ...s.packages.map((x) => x.version)].filter((v) => v !== p.version);
            if (bad.length || s.name !== p.mcpName) { console.error("server.json is out of step with package.json"); process.exit(1); }
          '

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      # WHATS-CHANGED.md: the version bump's entry is "## Unreleased: Title" until the release
      # commit dates it ("## YYYY-MM-DD: Title", same title). This fails while one is left.
      # scripts/whats_changed.py is a copy of the workspace's canonical file; never edit it.
      - name: WHATS-CHANGED.md has no Unreleased entry
        run: python3 scripts/whats_changed.py check WHATS-CHANGED.md --release

      # DATA-SOURCES.json: fails while server.contact_email is still the placeholder
      # (contact-not-yet-named@example.invalid), so no catalog with it can be published.
      # BetaNYC names a monitored address first (about-data standard § 1).
      - name: DATA-SOURCES.json is ready to release
        run: python3 scripts/whats_changed.py about-data check DATA-SOURCES.json --release

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
